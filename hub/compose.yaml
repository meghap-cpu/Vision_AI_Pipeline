# Hub: api-dashboard + postgres (+ a local Kafka for testing). Start: docker compose up -d --build
# Production: set KAFKA_BOOTSTRAP to CampNeuron's Kafka in hub/.env and drop the kafka service.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: vision
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vision -d vision"]
      interval: 5s
      retries: 12
    restart: unless-stopped
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    restart: unless-stopped
  api-dashboard:
    build: .
    environment:
      DATABASE_URL: postgresql://vision:${POSTGRES_PASSWORD:-change-me}@postgres:5432/vision
      EVIDENCE_DIR: /data/evidence
      CONFIG_DIR: /data/configs
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-safety.alerts}
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:-http://localhost:8100}
      SITE_TZ: ${SITE_TZ:-UTC}
      NODE_DOWN_AFTER_S: ${NODE_DOWN_AFTER_S:-120}
      EVIDENCE_KEEP_DAYS: ${EVIDENCE_KEEP_DAYS:-30}   # clean-up: photos older than this go (if sent)
      EVIDENCE_MAX_GB: ${EVIDENCE_MAX_GB:-20}         # and the oldest sent ones go while over this
      EVENTS_KEEP_DAYS: ${EVENTS_KEEP_DAYS:-90}
    volumes:
      - evidence:/data/evidence
      - ./configs:/data/configs:ro
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped
volumes:
  pgdata: {}
  evidence: {}
  kafkadata: {}
