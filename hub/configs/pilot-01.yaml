models:
- name: ppe
  config: config/pgie_ppe.txt
  gie_id: 3
  input:
  - 3
  - 560
  - 560
  tensor: image
  cameras:
  - cam07
  - cam08
- name: pose
  config: config/sgie_pose.txt
  gie_id: 4
  crop: pose
  cameras:
  - cam09
  - cam10
vlm:
  url: http://127.0.0.1:8001/v1
  backup_url: http://127.0.0.1:8002/v1
  _real_url: http://192.168.0.119:8010/v1
  model: cpatonn/Qwen3-VL-4B-Instruct-AWQ-4bit
  timeout_s: 30
hub:
  url: http://192.168.0.154:8100
retention:
  max_memory_gb: 8
  snapshot_keep_hours: 24
  snapshot_max_gb: 2
  outbox_keep_days: 7
  disk_warn_free_gb: 2
model_versions:
  ppe: ppe-merged rfdetr v1
  man_down: rtmpose-m
  fire_smoke: qwen3-vl-4b-awq
  worker_at_height: qwen3-vl-4b-awq
  crowd: yolo26s
  housekeeping: yolo26s + background
  motion: background model
detection_types:
  ppe:
    model: PPE
    version: v2.3
    confidence: 0.5
    stability:
    - 8
    - 10
    min_object_px: 48
    calibrations:
      cam07:
        confidence: 0.55
  fire_smoke:
    model: Fire & Smoke
    version: v3.0
  worker_at_height:
    model: Harness check (VLM)
    version: qwen3-vl-4b
  line:
    model: Line Crossing
    version: v1.0
    use_case: line_crossing
rules:
- name: Helmet Compliance
  detection: ppe
  item: hardhat
  severity: High
  status: Active
  instances:
  - camera: cam07
    instance: Workshop A
    duration_s: 10
    cooldown_s: 300
  - camera: cam08
    instance: Electric room
    duration_s: 10
    cooldown_s: 300
- name: Safety Vest
  detection: ppe
  item: vest
  severity: Medium
  status: Active
  instances:
  - camera: cam08
    instance: Electric room
    duration_s: 10
    cooldown_s: 300
- name: Harness at Height
  detection: worker_at_height
  status: Active
  instances:
  - zones:
    - - - 0.0
        - 0.45
      - - 0.35
        - 0.45
      - - 0.35
        - 1.0
      - - 0.0
        - 1.0
    edges:
    - - - 0.3
        - 0.45
      - - 0.3
        - 1.0
    camera: cam13
    instance: Scaffold A
  - zones:
    - - - 0.0
        - 0.45
      - - 0.35
        - 0.45
      - - 0.35
        - 1.0
      - - 0.0
        - 1.0
    edges:
    - - - 0.3
        - 0.45
      - - 0.3
        - 1.0
    camera: cam14
    instance: Scaffold B
- name: Fire and Smoke
  detection: fire_smoke
  severity: High
  status: Active
  instances:
  - camera: cam11
    instance: Kitchen
  - camera: cam12
    instance: Generator room
- name: Line Crossing - Gates
  detection: line
  status: Draft
  instances: []
